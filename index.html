<style>
/* =====================================================================
   COLORES (sacados de la fachada y del logo)
   Para cambiar la paleta, modifica SOLO estas variables.
   ===================================================================== */
:root{
  --dorado:        #B8892B;   /* dorado del logo bordado        */
  --dorado-claro:  #D9B04A;
  --marron:        #3B2A22;   /* marrón oscuro del letrero      */
  --marron-medio:  #5A4034;
  --beige:         #E3C2A3;   /* color durazno/beige de fachada */
  --crema:         #F8F1E8;
  --blanco:        #FFFFFF;   /* pared blanca de la fachada     */
  --azul:          #0B3FA8;   /* cielo de Arequipa              */
  --texto:         #2B211C;
  --gris:          #6B5F58;
  --sombra:        0 8px 24px rgba(59,42,34,.15);
  --radio:         14px;
  --ancho:         1120px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color:var(--texto);
  background:var(--crema);
  line-height:1.6;
}
img{max-width:100%;display:block}
a{color:inherit}
.contenedor{width:100%;max-width:var(--ancho);margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}

/* ------------------------------ BOTONES ------------------------------ */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:999px;border:2px solid var(--dorado);
  background:var(--dorado);color:var(--blanco);font-weight:700;text-decoration:none;
  cursor:pointer;transition:transform .15s, background .2s, color .2s;
}
.btn:hover{transform:translateY(-2px);background:var(--dorado-claro);border-color:var(--dorado-claro)}
.btn.sec{background:transparent;color:var(--blanco);border-color:var(--blanco)}
.btn.sec:hover{background:var(--blanco);color:var(--marron)}

/* ------------------------------ CABECERA ------------------------------ */
header.top{
  position:sticky;top:0;z-index:50;
  background:var(--marron);color:var(--blanco);
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.top .barra{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none}
.marca img{height:46px;width:auto;border-radius:6px}

/* Logo de respaldo (si no existe images/logo.png se muestra este) */
.logo-respaldo{
  display:none;width:46px;height:46px;border-radius:8px;
  background:var(--marron-medio);border:1.5px solid var(--dorado);
  color:var(--dorado-claro);font-family:Georgia,serif;font-weight:700;
  font-size:15px;letter-spacing:1px;align-items:center;justify-content:center;
}
.marca .nombre{font-family:Georgia,serif;font-size:1.05rem;line-height:1.15}
.marca .nombre small{display:block;color:var(--dorado-claro);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;font-family:"Segoe UI",sans-serif}

nav ul{list-style:none;display:flex;gap:6px;margin:0;padding:0}
nav a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:.95rem}
nav a:hover{background:var(--marron-medio);color:var(--dorado-claro)}
.menu-btn{display:none;background:none;border:1.5px solid var(--dorado);color:var(--blanco);
  border-radius:8px;padding:6px 12px;font-size:1.3rem;cursor:pointer}

@media (max-width:760px){
  .js .menu-btn{display:block}
  .js nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--marron);padding:10px 20px 18px}
  .js nav.abierto{display:block}
  nav ul{flex-direction:column}
  .top .barra{flex-wrap:wrap;padding:8px 0}
}

/* ------------------------------ HERO ------------------------------ */
.hero{
  position:relative;color:var(--blanco);text-align:center;
  padding:110px 0 100px;
  background:
    linear-gradient(rgba(59,42,34,.62),rgba(59,42,34,.72)),
    url("images/fachada1.jpg") center/cover no-repeat,
    linear-gradient(135deg,var(--marron),var(--azul));
  background-color:var(--marron);
}
.hero .sello{
  display:inline-block;border:1.5px solid var(--dorado-claro);color:var(--dorado-claro);
  padding:5px 16px;border-radius:999px;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;
}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin-bottom:.3em;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.hero h1 span{color:var(--dorado-claro)}
.hero p.lema{font-size:clamp(1rem,2.4vw,1.25rem);max-width:640px;margin:0 auto 28px;color:#f1e6da}
.hero .acciones{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ------------------------------ SECCIONES ------------------------------ */
section{padding:72px 0}
.titulo{text-align:center;margin-bottom:42px}
.titulo h2{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--marron)}
.titulo h2::after{content:"";display:block;width:70px;height:3px;background:var(--dorado);margin:12px auto 0;border-radius:3px}
.titulo p{color:var(--gris);max-width:560px;margin:10px auto 0}

/* Servicios */
#servicios{background:var(--blanco)}
.grid-serv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.serv{
  background:var(--crema);border:1px solid var(--beige);border-radius:var(--radio);
  padding:26px 20px;text-align:center;transition:transform .2s, box-shadow .2s;
}
.serv:hover{transform:translateY(-5px);box-shadow:var(--sombra);border-color:var(--dorado)}
.serv .icono{font-size:2.5rem;margin-bottom:8px}
.serv h3{font-size:1.05rem;color:var(--marron);margin-bottom:4px}
.serv p{margin:0;color:var(--gris);font-size:.92rem}

/* Habitaciones */
.grid-hab{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.hab{background:var(--blanco);border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra)}
.hab .foto{aspect-ratio:4/3;background:linear-gradient(135deg,var(--beige),var(--dorado-claro));display:flex;align-items:center;justify-content:center;font-size:3rem}
.hab .foto img{width:100%;height:100%;object-fit:cover}
.hab .info{padding:18px}
.hab .info h3{color:var(--marron);margin-bottom:.2em}
.hab .camas{margin:.2em 0;color:var(--gris);font-size:.93rem}
.hab .pisos{margin:.2em 0 .6em;color:var(--gris);font-size:.85rem}
.hab .nums{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--crema);border:1px solid var(--beige);color:var(--marron);font-size:.82rem;font-weight:600}
.hab .precio{color:var(--dorado);font-weight:700;font-size:1.1rem;border-top:1px solid var(--beige);padding-top:10px}

/* Resumen */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;max-width:760px;margin:0 auto 38px}
.resumen div{background:var(--blanco);border:1px solid var(--beige);border-radius:var(--radio);padding:14px 10px;text-align:center}
.resumen strong{display:block;font-family:Georgia,serif;font-size:2rem;color:var(--dorado);line-height:1}
.resumen span{font-size:.85rem;color:var(--gris)}

/* TV y streaming */
#entretenimiento{background:linear-gradient(135deg,var(--marron),#1B2D63);color:var(--blanco)}
#entretenimiento .titulo h2{color:var(--dorado-claro)}
#entretenimiento .titulo h2::after{background:var(--dorado-claro)}
#entretenimiento .titulo p{color:#e6d9cc}
.plataformas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:34px}
.plat{padding:10px 22px;border-radius:999px;border:1.5px solid var(--dorado-claro);background:rgba(255,255,255,.08);font-weight:700;letter-spacing:.5px}
.grid-ext{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.ext{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:var(--radio);padding:22px 18px;text-align:center}
.ext .icono{font-size:2.2rem;margin-bottom:6px}
.ext h3{font-size:1.05rem;color:var(--dorado-claro);margin-bottom:4px}
.ext p{margin:0;font-size:.9rem;color:#e6d9cc}
.mas{text-align:center;margin:28px 0 0;font-size:1.1rem;color:var(--dorado-claro);font-family:Georgia,serif}

/* Galería */
#galeria{background:var(--beige)}
.grid-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gal-item{
  aspect-ratio:4/3;border-radius:var(--radio);overflow:hidden;background:var(--marron-medio);
  box-shadow:var(--sombra);cursor:zoom-in;position:relative;
